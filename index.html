<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayi Music</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg-color: #121212; --surface-color: #1e1e1e; --primary-color: #bb86fc;
            --primary-variant: #9b59b6; --text-primary: #ffffff; --text-secondary: #b3b3b3;
            --player-height: 90px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); padding-bottom: calc(var(--player-height) + 20px); }

        header {
            background-color: var(--surface-color); padding: 15px 20px; border-bottom: 2px solid var(--primary-color);
            position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center;
        }
        .header-spacer { width: 40px; }
        header h1 { color: var(--primary-color); display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 1.6rem; margin: 0; }
        .app-logo { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
        .profile-btn {
            background: none; border: none; color: var(--text-secondary); cursor: pointer; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: color 0.3s, background 0.3s;
        }
        .profile-btn:hover { color: var(--primary-color); background: rgba(255,255,255,0.05); }

        main { max-width: 800px; margin: 20px auto; padding: 0 15px; }

        .main-tabs { display: flex; background-color: var(--surface-color); border-radius: 12px; margin-bottom: 20px; overflow: hidden; border: 1px solid #333; }
        .main-tab {
            flex: 1; padding: 14px 5px; text-align: center; background: none; border: none; color: var(--text-secondary);
            font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .main-tab.active { background-color: var(--primary-color); color: #000; }

        .controls-section { background-color: var(--surface-color); border-radius: 12px; padding: 20px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px; }
        .search-bar { display: flex; gap: 10px; }
        .search-bar input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background-color: #2a2a2a; color: white; outline: none; transition: border-color 0.3s; }
        .search-bar input:focus { border-color: var(--primary-color); }

        .action-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
        .btn {
            background-color: var(--primary-color); color: #000; border: none; padding: 12px 20px; border-radius: 8px;
            cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: background-color 0.3s;
        }
        .btn:hover { background-color: var(--primary-variant); color: white; }
        .btn-secondary { background-color: #333; color: white; }
        .btn-danger { background-color: #cf6679; color: #000; }

        .local-file-wrapper { position: relative; overflow: hidden; display: inline-block; }
        .local-file-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }

        ul.playlist { list-style: none; }
        .track-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #333; cursor: pointer; transition: background-color 0.2s; border-radius: 8px; }
        .track-item:hover, .track-item.active { background-color: rgba(187, 134, 252, 0.1); }
        .track-item.active { border-left: 4px solid var(--primary-color); }
        .track-img { width: 50px; height: 50px; border-radius: 4px; margin-right: 15px; background-color: #333; object-fit: cover; }
        .track-info-list { flex: 1; overflow: hidden; }
        .track-title-list { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist-list { font-size: 0.85rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .edit-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: color 0.2s; }

        /* MODAL DE INICIO DE SESIÓN */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8);
            z-index: 4000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.open { display: flex; opacity: 1; }
        .modal-content { background-color: var(--surface-color); border-radius: 12px; width: 90%; max-width: 400px; padding: 25px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { font-size: 1.3rem; color: var(--primary-color); margin: 0; }
        .modal-body { display: flex; flex-direction: column; gap: 15px; align-items: center; }
        
        .google-login-btn {
            background-color: white; color: #757575; border: none; padding: 12px 20px; border-radius: 4px;
            font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 2px 4px 0 rgba(0,0,0,.25); width: 100%; font-family: Roboto, arial, sans-serif;
        }
        .google-login-btn img { width: 18px; height: 18px; }

        /* REPRODUCTOR DE MÚSICA FIJO INFERIOR */
        .player-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: var(--player-height); background-color: var(--surface-color);
            border-top: 1px solid #333; display: flex; align-items: center; padding: 0 20px; gap: 15px; box-shadow: 0 -4px 10px rgba(0,0,0,0.5); z-index: 1000;
        }
        .now-playing { display: flex; align-items: center; width: 30%; min-width: 150px; overflow: hidden; cursor: pointer; }
        .now-playing img { width: 60px; height: 60px; border-radius: 6px; margin-right: 15px; object-fit: cover; }
        .now-playing-info { overflow: hidden; }
        .np-title { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .np-artist { font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-controls-container { flex: 1; display: flex; flex-direction: column; align-items: center; }
        .main-controls { display: flex; align-items: center; gap: 15px; margin-bottom: 5px; user-select: none; }
        .main-controls span { cursor: pointer; color: var(--text-secondary); transition: color 0.2s; font-size: 26px; position: relative; }
        .main-controls span:hover { color: var(--text-primary); }
        .main-controls span.active-mode { color: var(--primary-color) !important; }
        .loop-one-badge {
            position: absolute; top: -4px; right: -6px; font-size: 10px; font-weight: bold; background: var(--primary-color);
            color: #000; border-radius: 50%; width: 14px; height: 14px; display: none; align-items: center; justify-content: center;
        }
        .main-controls .play-btn { color: var(--text-primary); font-size: 38px; }
        .progress-container { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 0.75rem; color: var(--text-secondary); }
        .progress-bar { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: #555; outline: none; cursor: pointer; }
        .progress-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--primary-color); cursor: pointer; }
        .volume-container { width: 15%; display: flex; align-items: center; gap: 10px; justify-content: flex-end; color: var(--text-secondary); }
        .volume-bar { width: 80px; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: #555; outline: none; cursor: pointer; }
        .volume-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--text-primary); cursor: pointer; }

        /* REPRODUCTOR DE VIDEO */
        #video-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; z-index: 3000;
            display: flex; flex-direction: column; justify-content: space-between; padding: 15px; transform: translateY(100%); transition: transform 0.3s ease-in-out;
        }
        #video-modal.open { transform: translateY(0); }
        .video-header { display: flex; justify-content: space-between; align-items: center; color: white; z-index: 10; }
        .video-container { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        video { max-width: 100%; max-height: 100%; width: 100%; height: auto; object-fit: contain; border-radius: 8px; }

        /* PANTALLA COMPLETA MÚSICA */
        #fullscreen-player {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-color); z-index: 2000;
            display: flex; flex-direction: column; justify-content: space-between; padding: 15px 20px 20px 20px;
            transform: translateY(100%); transition: transform 0.3s ease-in-out;
        }
        #fullscreen-player.open { transform: translateY(0); }
        .fs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .fs-header span { cursor: pointer; font-size: 28px; }
        .fs-content { display: flex; flex-direction: column; align-items: center; flex: 1; justify-content: center; text-align: center; gap: 12px; overflow: hidden; }
        .fs-cover-large { width: 220px; height: 220px; border-radius: 16px; object-fit: cover; box-shadow: 0 10px 30px rgba(187, 132, 252, 0.3); transition: all 0.3s ease; }
        .fs-cover-small { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; box-shadow: 0 4px 12px rgba(187, 132, 252, 0.2); transition: all 0.3s ease; }
        .fs-title { font-size: 1.15rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%; }
        .fs-artist { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 2px; }

        .add-lyrics-btn {
            background-color: var(--surface-color); border: 1px dashed var(--primary-color); color: var(--primary-color);
            padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; margin-top: 5px; transition: background 0.2s;
        }
        .add-lyrics-btn:hover { background-color: rgba(187, 134, 252, 0.1); }
        .lyrics-box {
            width: 100%; max-width: 500px; background: var(--surface-color); border-radius: 12px; padding: 10px 15px; text-align: center;
            flex: 1; max-height: calc(100vh - 320px); overflow-y: hidden; border: 1px solid #333; display: none; flex-direction: column;
        }
        .lyrics-box.active { display: flex; }
        .lyrics-header { font-size: 0.75rem; color: var(--primary-color); margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        .lyrics-scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; padding: 5px; font-size: 1rem; line-height: 1.6; color: var(--text-secondary); white-space: pre-line; }
        .lyrics-scroll textarea { width: 100%; height: 100%; background: transparent; border: none; color: white; resize: none; outline: none; font-size: 1rem; line-height: 1.6; text-align: center; }
        
        .fs-controls { width: 100%; max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; padding-top: 5px; }
        .status-message { text-align: center; margin: 10px 0; color: var(--text-secondary); font-size: 0.9rem; }

        @media (max-width: 768px) {
            .player-bar { padding: 0 10px; gap: 10px; }
            .volume-container { display: none; }
            .now-playing { width: 40%; }

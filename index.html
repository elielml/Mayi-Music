<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayi Music</title>
    <!-- Google Fonts e Iconos de Material Design -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Rounded" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --primary-variant: #9b59b6;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --player-height: 90px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding-bottom: calc(var(--player-height) + 20px);
        }

        header {
            background-color: var(--surface-color);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1.6rem;
        }

        .app-logo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            object-fit: cover;
        }

        main {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .controls-section {
            background-color: var(--surface-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
        }

        .search-bar input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-bar input:focus {
            border-color: var(--primary-color);
        }

        .btn {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: var(--primary-variant);
            color: white;
        }

        .local-file-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .local-file-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        #playlist {
            list-style: none;
        }

        .track-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            transition: background-color 0.2s;
            border-radius: 8px;
        }

        .track-item:hover, .track-item.active {
            background-color: rgba(187, 134, 252, 0.1);
        }

        .track-item.active {
            border-left: 4px solid var(--primary-color);
        }

        .track-img {
            width: 50px;
            height: 50px;
            border-radius: 4px;
            margin-right: 15px;
            background-color: #333;
            object-fit: cover;
        }

        .track-info-list {
            flex: 1;
            overflow: hidden;
        }

        .track-title-list {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist-list {
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* REPRODUCTOR FIJO INFERIOR */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--player-height);
            background-color: var(--surface-color);
            border-top: 1px solid #333;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .now-playing {
            display: flex;
            align-items: center;
            width: 30%;
            min-width: 150px;
            overflow: hidden;
        }

        .now-playing img {
            width: 60px;
            height: 60px;
            border-radius: 6px;
            margin-right: 15px;
            object-fit: cover;
        }

        .now-playing-info {
            overflow: hidden;
        }

        .np-title {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .np-artist {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-controls-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 5px;
        }

        .main-controls span {
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.2s;
            font-size: 32px;
        }

        .main-controls span:hover {
            color: var(--text-primary);
        }

        .main-controls .play-btn {
            color: var(--text-primary);
            font-size: 42px;
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .progress-bar {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: #555;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
        }

        .volume-container {
            width: 20%;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: flex-end;
            color: var(--text-secondary);
        }

        .volume-bar {
            width: 100px;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: #555;
            outline: none;
            cursor: pointer;
        }
        
        .volume-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-primary);
            cursor: pointer;
        }

        #status-message {
            text-align: center;
            margin: 10px 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .player-bar {
                padding: 0 10px;
                gap: 10px;
            }
            .volume-container {
                display: none;
            }
            .now-playing {
                width: 40%;
            }
            .now-playing img {
                width: 50px;
                height: 50px;
                margin-right: 10px;
            }
            .main-controls span {
                font-size: 28px;
            }
            .main-controls .play-btn {
                font-size: 38px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <!-- Si tienes el logo llamado logo.png, cargará aquí. Si no, mostrará el icono. -->
            <img src="logo.png" alt="Mayi Music Logo" class="app-logo" onerror="this.style.display='none'; document.getElementById('fallback-icon').style.display='inline-block';">
            <span class="material-icons-rounded" id="fallback-icon" style="display:none;">headphones</span> 
            Mayi Music
        </h1>
    </header>

    <main>
        <div class="controls-section">
            <p style="font-size: 0.9rem; color: var(--text-secondary);">
                Busca música en línea (previews de 30s) o reproduce archivos desde tu dispositivo.
            </p>
            
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Buscar canción o artista..." onkeypress="handleKeyPress(event)">
                <button class="btn" onclick="searchMusic()">
                    <span class="material-icons-rounded">search</span> Buscar
                </button>
            </div>

            <div class="local-file-wrapper">
                <button class="btn" style="background-color: #333; color: white;">
                    <span class="material-icons-rounded">folder_open</span> Cargar música de mi dispositivo
                </button>
                <input type="file" id="local-file-input" accept="audio/*" multiple onchange="loadLocalFiles(event)">
            </div>
            
            <div id="status-message"></div>
        </div>

        <ul id="playlist"></ul>
    </main>

    <div class="player-bar">
        <div class="now-playing">
            <!-- Usa el logo como portada por defecto para las canciones -->
            <img id="player-cover" src="logo.png" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='" alt="Portada">
            <div class="now-playing-info">
                <div class="np-title" id="player-title">Sin pista</div>
                <div class="np-artist" id="player-artist">Desconocido</div>
            </div>
        </div>

        <div class="player-controls-container">
            <div class="main-controls">
                <span class="material-icons-rounded" onclick="prevTrack()">skip_previous</span>
                <span class="material-icons-rounded play-btn" id="play-pause-btn" onclick="togglePlay()">play_circle_filled</span>
                <span class="material-icons-rounded" onclick="nextTrack()">skip_next</span>
            </div>
            <div class="progress-container">
                <span id="time-current">0:00</span>
                <input type="range" class="progress-bar" id="seek-bar" value="0" step="1" onchange="seekTrack()" oninput="updateSeekTime()">
                <span id="time-total">0:00</span>
            </div>
        </div>

        <div class="volume-container">
            <span class="material-icons-rounded" id="volume-icon">volume_up</span>
            <input type="range" class="volume-bar" id="volume-bar" min="0" max="1" step="0.05" value="1" oninput="changeVolume()">
        </div>
    </div>

    <script>
        const audio = new Audio();
        let queue = [];
        let currentIndex = -1;
        let isPlaying = false;

        const playlistEl = document.getElementById('playlist');
        const searchInput = document.getElementById('search-input');
        const statusMsg = document.getElementById('status-message');
        
        const playerCover = document.getElementById('player-cover');
        const playerTitle = document.getElementById('player-title');
        const playerArtist = document.getElementById('player-artist');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const seekBar = document.getElementById('seek-bar');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');
        const volumeBar = document.getElementById('volume-bar');

        function handleKeyPress(e) {
            if (e.key === 'Enter') searchMusic();
        }

        async function searchMusic() {
            const query = searchInput.value.trim();
            if (!query) return;

            statusMsg.textContent = "Buscando...";
            playlistEl.innerHTML = '';
            
            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=25`);
                if (!response.ok) throw new Error("Error en la conexión");
                const data = await response.json();
                
                if (data.results.length === 0) {
                    statusMsg.textContent = "No se encontraron resultados.";
                    return;
                }

                statusMsg.textContent = "Resultados encontrados (Previews de 30s)";
                queue = data.results.map(track => ({
                    title: track.trackName,
                    artist: track.artistName,
                    url: track.previewUrl,
                    cover: track.artworkUrl100 || 'logo.png',
                    isLocal: false
                })).filter(track => track.url);

                renderPlaylist();
                
            } catch (error) {
                statusMsg.textContent = "Hubo un error al buscar la música. Intenta de nuevo.";
                console.error(error);
            }
        }

        function loadLocalFiles(event) {
            const files = event.target.files;
            if (files.length === 0) return;

            const startIndex = queue.length;

            for (let file of files) {
                const url = URL.createObjectURL(file);
                queue.push({
                    title: file.name.replace(/\.[^/.]+$/, ""),
                    artist: "Archivo Local",
                    url: url,
                    cover: 'logo.png', // Usará tu logo como portada para música local
                    isLocal: true
                });
            }

            statusMsg.textContent = `${files.length} archivo(s) local(es) añadido(s).`;
            renderPlaylist();
            
            if (currentIndex === -1) {
                loadTrack(startIndex);
                playTrack();
            }
        }

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            queue.forEach((track, index) => {
                const li = document.createElement('li');
                li.className = `track-item ${index === currentIndex ? 'active' : ''}`;
                li.onclick = () => {
                    loadTrack(index);
                    playTrack();
                };

                li.innerHTML = `
                    <img src="${track.cover}" class="track-img" alt="Portada" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='">
                    <div class="track-info-list">
                        <div class="track-title-list">${track.title}</div>
                        <div class="track-artist-list">${track.artist}</div>
                    </div>
                `;
                playlistEl.appendChild(li);
            });
        }

        function loadTrack(index) {
            if (index < 0 || index >= queue.length) return;
            
            currentIndex = index;
            const track = queue[currentIndex];
            
            audio.src = track.url;
            audio.load();

            playerTitle.textContent = track.title;
            playerArtist.textContent = track.artist;
            playerCover.src = track.cover;

            renderPlaylist();
        }

        function togglePlay() {
            if (currentIndex === -1 && queue.length > 0) {
                loadTrack(0);
            }
            if (!audio.src) return;

            if (audio.paused) {
                playTrack();
            } else {
                pauseTrack();
            }
        }

        function playTrack() {
            audio.play().then(() => {
                isPlaying = true;
                playPauseBtn.textContent = 'pause_circle_filled';
            }).catch(e => {
                console.error("Error:", e);
                alert("Este formato de archivo podría no ser compatible.");
            });
        }

        function pauseTrack() {
            audio.pause();
            isPlaying = false;
            playPauseBtn.textContent = 'play_circle_filled';
        }

        function prevTrack() {
            if (currentIndex > 0) {
                loadTrack(currentIndex - 1);
                playTrack();
            }
        }

        function nextTrack() {
            if (currentIndex < queue.length - 1) {
                loadTrack(currentIndex + 1);
                playTrack();
            } else {
                loadTrack(0);
                pauseTrack();
            }
        }

        audio.addEventListener('timeupdate', () => {
            if (isNaN(audio.duration)) return;
            seekBar.max = audio.duration;
            seekBar.value = audio.currentTime;
            timeCurrent.textContent = formatTime(audio.currentTime);
            timeTotal.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', nextTrack);

        function updateSeekTime() {
            timeCurrent.textContent = formatTime(seekBar.value);
        }

        function seekTrack() {
            audio.currentTime = seekBar.value;
            if (!isPlaying) playTrack();
        }

        function formatTime(seconds) {
            let min = Math.floor(seconds / 60);
            let sec = Math.floor(seconds % 60);
            if (sec < 10) sec = `0${sec}`;
            return `${min}:${sec}`;
        }

        function changeVolume() {
            audio.volume = volumeBar.value;
            const volIcon = document.getElementById('volume-icon');
            if (audio.volume === 0) volIcon.textContent = 'volume_off';
            else if (audio.volume < 0.5) volIcon.textContent = 'volume_down';
            else volIcon.textContent = 'volume_up';
        }

        audio.volume = 1;
    </script>
</body>
</html>

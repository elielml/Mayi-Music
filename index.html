<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    <title>Mayi Music</title>
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            user-select: none; 
            -webkit-user-select: none;
        }
        
        .contenedor-busqueda { width: 100%; max-width: 400px; margin-bottom: 15px; margin-top: 10px; }
        .input-busqueda {
            width: 100%; padding: 15px; border-radius: 25px; border: none;
            background-color: #282828; color: white; font-size: 16px; box-sizing: border-box; outline: none;
        }
        
        .resultados { width: 100%; max-width: 400px; max-height: 180px; overflow-y: auto; margin-bottom: 20px; }
        .item-cancion {
            display: flex; align-items: center; padding: 10px;
            background-color: #181818; margin-bottom: 5px; border-radius: 10px; cursor: pointer;
        }
        .item-cancion:active { background-color: #282828; }
        .item-imagen { width: 45px; height: 45px; border-radius: 5px; margin-right: 15px; object-fit: cover; }
        .item-textos { display: flex; flex-direction: column; overflow: hidden; }
        .item-titulo { font-size: 14px; font-weight: bold; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-artista { font-size: 12px; color: #A0A0A0; margin: 0; }

        .reproductor {
            display: flex; flex-direction: column; align-items: center; width: 100%;
            max-width: 400px; flex-grow: 1; justify-content: center;
        }
        .caratula {
            width: 280px; height: 280px; border-radius: 20px; margin-bottom: 30px;
            object-fit: cover; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        .titulo { font-size: 24px; font-weight: bold; margin: 0 0 5px 0; text-align: center; }
        .artista { font-size: 16px; color: #A0A0A0; margin: 0 0 30px 0; text-align: center; }
        
        .contenedor-progreso { width: 100%; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .tiempo { font-size: 12px; color: #A0A0A0; width: 40px; text-align: center; }
        .barra-progreso {
            flex-grow: 1; appearance: none; height: 6px; background: #404040;
            border-radius: 5px; outline: none;
        }
        .barra-progreso::-webkit-slider-thumb {
            appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #E1306C; cursor: pointer;
        }

        .boton {
            background-color: #E1306C; color: white; border: none; padding: 18px 50px;
            border-radius: 30px; font-size: 20px; font-weight: bold; cursor: pointer; transition: transform 0.1s;
        }
        .boton:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="contenedor-busqueda">
        <input type="text" id="inputBusqueda" class="input-busqueda" placeholder="Buscar canción completa...">
    </div>

    <div id="contenedorResultados" class="resultados"></div>

    <div class="reproductor">
        <!-- Reemplaza logo.png por la foto que quieras que salga por defecto -->
        <img id="caratula" class="caratula" src="logo.png" alt="Mayi Music">
        <h1 id="titulo" class="titulo">Mayi Music</h1>
        <p id="artista" class="artista">Buscador Activo</p>

        <div class="contenedor-progreso">
            <span id="tiempoActual" class="tiempo">0:00</span>
            <input type="range" id="barraProgreso" class="barra-progreso" value="0" step="1" min="0" max="100">
            <span id="tiempoTotal" class="tiempo">0:00</span>
        </div>

        <button id="botonReproducir" class="boton">Reproducir</button>
    </div>

    <script>
        const reproductor = new Audio();
        let estaReproduciendo = false;

        const inputBusqueda = document.getElementById('inputBusqueda');
        const contenedorResultados = document.getElementById('contenedorResultados');
        const caratula = document.getElementById('caratula');
        const titulo = document.getElementById('titulo');
        const artista = document.getElementById('artista');
        const botonReproducir = document.getElementById('botonReproducir');
        const barraProgreso = document.getElementById('barraProgreso');
        const txtTiempoActual = document.getElementById('tiempoActual');
        const txtTiempoTotal = document.getElementById('tiempoTotal');

        // Formatear segundos a minutos:segundos (Ej: 3:45)
        function formatearTiempo(segundos) {
            if (isNaN(segundos)) return "0:00";
            const min = Math.floor(segundos / 60);
            const seg = Math.floor(segundos % 60);
            return `${min}:${seg < 10 ? '0' : ''}${seg}`;
        }

        // 1. LA BÚSQUEDA A LA API DE CANCIONES COMPLETAS
        inputBusqueda.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const termino = inputBusqueda.value;
                if (!termino) return;
                
                // Ocultar teclado en móviles
                inputBusqueda.blur();
                contenedorResultados.innerHTML = "<p style='text-align:center; color:#A0A0A0;'>Buscando canciones completas...</p>";
                
                try {
                    // Nos conectamos a la API pública de Saavn (canciones enteras)
                    const respuesta = await fetch(`https://saavn.dev/api/search/songs?query=${encodeURIComponent(termino)}`);
                    const json = await respuesta.json();
                    
                    if (json.success && json.data.results.length > 0) {
                        mostrarResultados(json.data.results);
                    } else {
                        contenedorResultados.innerHTML = "<p style='text-align:center; color:#A0A0A0;'>No se encontraron resultados.</p>";
                    }
                } catch (error) {
                    contenedorResultados.innerHTML = "<p style='text-align:center; color:#A0A0A0;'>Error al conectar. Intenta de nuevo.</p>";
                }
            }
        });

        // 2. EL MAPEO DE DATOS
        function mostrarResultados(resultados) {
            contenedorResultados.innerHTML = '';
            
            // Tomamos los primeros 5 resultados para no saturar la pantalla
            resultados.slice(0, 5).forEach(item => {
                
                // Buscamos la mejor calidad de imagen y audio en los arreglos que devuelve la API
                const mejorImagen = item.image && item.image.length > 0 ? item.image[item.image.length - 1].url : 'logo.png';
                const mejorAudio = item.downloadUrl && item.downloadUrl.length > 0 ? item.downloadUrl[item.downloadUrl.length - 1].url : '';

                const cancion = {
                    titulo: item.name,
                    artista: item.primaryArtists || "Artista",
                    urlCaratula: mejorImagen,
                    fuenteDeAudio: mejorAudio
                };

                // Si por alguna razón la canción no tiene enlace de audio, la saltamos
                if (!cancion.fuenteDeAudio) return;

                const div = document.createElement('div');
                div.className = 'item-cancion';
                div.innerHTML = `
                    <img src="${cancion.urlCaratula}" class="item-imagen">
                    <div class="item-textos">
                        <p class="item-titulo">${cancion.titulo}</p>
                        <p class="item-artista">${cancion.artista}</p>
                    </div>
                `;

                div.onclick = () => cargarCancion(cancion);
                contenedorResultados.appendChild(div);
            });
        }

        // 3. REPRODUCCIÓN OCULTA
        function cargarCancion(cancion) {
            titulo.textContent = cancion.titulo;
            artista.textContent = cancion.artista;
            caratula.src = cancion.urlCaratula;
            
            reproductor.src = cancion.fuenteDeAudio;
            reproductor.play();
            
            estaReproduciendo = true;
            botonReproducir.textContent = "Pausar";
            contenedorResultados.innerHTML = ''; 
            inputBusqueda.value = '';
        }

        // Control del Botón Play/Pause
        botonReproducir.addEventListener("click", () => {
            if (!reproductor.src) return; 
            
            if (estaReproduciendo) {
                reproductor.pause();
                botonReproducir.textContent = "Reproducir";
            } else {
                reproductor.play();
                botonReproducir.textContent = "Pausar";
            }
            estaReproduciendo = !estaReproduciendo;
        });

        // Evento cuando la canción termina
        reproductor.addEventListener('ended', () => {
            botonReproducir.textContent = "Reproducir";
            estaReproduciendo = false;
            barraProgreso.value = 0;
            txtTiempoActual.textContent = "0:00";
        });

        // Actualizar la barra de progreso y los textos de tiempo
        reproductor.addEventListener('timeupdate', () => {
            if (reproductor.duration) {
                const

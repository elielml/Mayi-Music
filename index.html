<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    <title>Mayi Music</title>
    
    <style>
        body {
            margin: 0; padding: 20px; background-color: #121212; color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; height: 100vh;
            box-sizing: border-box; user-select: none; -webkit-user-select: none;
        }
        
        .contenedor-busqueda { display: flex; gap: 10px; width: 100%; max-width: 400px; margin-bottom: 15px; margin-top: 10px; }
        .input-busqueda {
            flex-grow: 1; padding: 15px; border-radius: 25px; border: none;
            background-color: #282828; color: white; font-size: 16px; outline: none;
        }
        .boton-lupa {
            background-color: #E1306C; border: none; border-radius: 50%; width: 50px; height: 50px;
            color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .boton-lupa:active { transform: scale(0.95); }
        
        .resultados { width: 100%; max-width: 400px; max-height: 180px; overflow-y: auto; margin-bottom: 20px; }
        .item-cancion {
            display: flex; align-items: center; padding: 10px; background-color: #181818; 
            margin-bottom: 5px; border-radius: 10px; cursor: pointer;
        }
        .item-cancion:active { background-color: #282828; }
        .item-imagen { width: 45px; height: 45px; border-radius: 5px; margin-right: 15px; object-fit: cover; }
        .item-textos { display: flex; flex-direction: column; overflow: hidden; }
        .item-titulo { font-size: 14px; font-weight: bold; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-artista { font-size: 12px; color: #A0A0A0; margin: 0; }

        .reproductor {
            display: flex; flex-direction: column; align-items: center; width: 100%;
            max-width: 400px; flex-grow: 1; justify-content: center;
        }
        .caratula {
            width: 280px; height: 280px; border-radius: 20px; margin-bottom: 30px;
            object-fit: cover; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        .titulo { font-size: 22px; font-weight: bold; margin: 0 0 5px 0; text-align: center; }
        .artista { font-size: 14px; color: #A0A0A0; margin: 0 0 30px 0; text-align: center; }
        
        .contenedor-progreso { width: 100%; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .tiempo { font-size: 12px; color: #A0A0A0; width: 40px; text-align: center; }
        .barra-progreso {
            flex-grow: 1; appearance: none; height: 6px; background: #404040; border-radius: 5px; outline: none;
        }
        .barra-progreso::-webkit-slider-thumb {
            appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #E1306C; cursor: pointer;
        }

        .boton {
            background-color: #E1306C; color: white; border: none; padding: 18px 50px;
            border-radius: 30px; font-size: 20px; font-weight: bold; cursor: pointer; transition: transform 0.1s;
        }
        .boton:active { transform: scale(0.95); }
        
        /* Contenedor invisible para YouTube */
        #reproductor-youtube { display: none; }
    </style>
</head>
<body>

    <div class="contenedor-busqueda">
        <input type="text" id="inputBusqueda" class="input-busqueda" placeholder="Buscar en YouTube...">
        <button id="botonBuscar" class="boton-lupa">🔍</button>
    </div>

    <div id="contenedorResultados" class="resultados"></div>

    <div class="reproductor">
        <img id="caratula" class="caratula" src="logo.png" alt="Mayi Music">
        <h1 id="titulo" class="titulo">Mayi Music</h1>
        <p id="artista" class="artista">Conectado a YouTube</p>

        <div class="contenedor-progreso">
            <span id="tiempoActual" class="tiempo">0:00</span>
            <input type="range" id="barraProgreso" class="barra-progreso" value="0" step="1" min="0" max="100">
            <span id="tiempoTotal" class="tiempo">0:00</span>
        </div>

        <button id="botonReproducir" class="boton">Reproducir</button>
    </div>

    <!-- Div donde YouTube cargará el video de forma invisible -->
    <div id="reproductor-youtube"></div>

    <script>
        // Variables de la interfaz
        const inputBusqueda = document.getElementById('inputBusqueda');
        const botonBuscar = document.getElementById('botonBuscar');
        const contenedorResultados = document.getElementById('contenedorResultados');
        const caratula = document.getElementById('caratula');
        const titulo = document.getElementById('titulo');
        const artista = document.getElementById('artista');
        const botonReproducir = document.getElementById('botonReproducir');
        const barraProgreso = document.getElementById('barraProgreso');
        const txtTiempoActual = document.getElementById('tiempoActual');
        const txtTiempoTotal = document.getElementById('tiempoTotal');

        let reproductorYT;
        let estaReproduciendo = false;
        let intervaloProgreso;

        // 1. CARGAR LA API OFICIAL DE YOUTUBE
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            reproductorYT = new YT.Player('reproductor-youtube', {
                height: '0',
                width: '0',
                videoId: '',
                playerVars: { 'playsinline': 1 },
                events: {
                    'onStateChange': alCambiarEstado
                }
            });
        }

        function formatearTiempo(segundos) {
            if (isNaN(segundos)) return "0:00";
            const min = Math.floor(segundos / 60);
            const seg = Math.floor(segundos % 60);
            return `${min}:${seg < 10 ? '0' : ''}${seg}`;
        }

        // 2. BUSCADOR DE YOUTUBE (Usando un proxy abierto y gratuito)
        async function realizarBusqueda() {
            const termino = inputBusqueda.value;
            if (!termino) return;
            
            inputBusqueda.blur();
            contenedorResultados.innerHTML = "<p style='text-align:center; color:#A0A0A0;'>Buscando en YouTube...</p>";
            
            try {
                // Usamos la API pública de Piped (un puente hacia YouTube)
                const respuesta = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(termino + ' audio oficial')}&filter=music_songs`);
                const json = await respuesta.json();
                
                if (json.items && json.items.length > 0) {
                    mostrarResultados(json.items);
                } else {
                    contenedorResultados.innerHTML = "<p style='text-align:center; color:#A0A0A0;'>No se encontraron resultados.</p>";
                }
            } catch (error) {
                contenedorResultados.innerHTML = "<p style='text-align:center; color:#A0A0A0;'>Error al conectar con YouTube. Intenta de nuevo.</p>";
            }
        }

        botonBuscar.addEventListener('click', realizarBusqueda);
        inputBusqueda.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') realizarBusqueda();
        });

        // 3. MAPEO Y RESULTADOS
        function mostrarResultados(resultados) {
            contenedorResultados.innerHTML = '';
            
            resultados.slice(0, 5).forEach(item => {
                // Extraemos el ID del video de YouTube (ej: /watch?v=ABCDEFG)
                const videoId = item.url.split('v=')[1];

                const cancion = {
                    id: videoId,
                    titulo: item.title,
                    artista: item.uploaderName || "YouTube Music",
                    urlCaratula: item.thumbnail || 'logo.png'
                };

                if (!cancion.id) return;

                const div = document.createElement('div');
                div.className = 'item-cancion';
                div.innerHTML = `
                    <img src="${cancion.urlCaratula}" class="item-imagen">
                    <div class="item-textos">
                        <p class="item-titulo">${cancion.titulo}</p>
                        <p class="item-artista">${cancion.artista}</p>
                    </div>
                `;

                div.onclick = () => cargarCancion(cancion);
                contenedorResultados.appendChild(div);
            });
        }

        // 4. CONTROL DEL REPRODUCTOR INVISIBLE DE YOUTUBE
        function cargarCancion(cancion) {
            titulo.textContent = cancion.titulo;
            artista.textContent = cancion.artista;
            caratula.src = cancion.urlCaratula;
            
            // Le pasamos el ID a YouTube y le decimos que inicie
            reproductorYT.loadVideoById(cancion.id);
            
            estaReproduciendo = true;
            botonReproducir.textContent = "Pausar";
            contenedorResultados.innerHTML = ''; 
            inputBusqueda.value = '';
            
            iniciarBarraProgreso();
        }

        botonReproducir.addEventListener("click", () => {
            if (!reproductorYT || !reproductorYT.getPlayerState) return;
            
            const estado = reproductorYT.getPlayerState();
            
            // Si está sonando (estado 1), pausamos
            if (estado === 1) {
                reproductorYT.pauseVideo();
                botonReproducir.textContent = "Reproducir";
                estaReproduciendo = false;
            } else {
                reproductorYT.playVideo();
                botonReproducir.textContent = "Pausar";
                estaReproduciendo = true;
            }
        });

        // Eventos de YouTube (cuando termina la canción)
        function alCambiarEstado(evento) {
            if (evento.data === YT.PlayerState.ENDED) {
                botonReproducir.textContent = "Reproducir";
                estaReproduciendo = false;
                barraProgreso.value = 0;
                txtTiempoActual.textContent = "0:00";
            }
        }

        // Actualizar la barra de progreso a mano porque YouTube no tiene evento 'timeupdate'
        function iniciarBarraProgreso() {
            clearInterval(intervaloProgreso);
            intervaloProgreso = setInterval(() => {
                if (reproductorYT && reproductorYT.getCurrentTime && estaReproduciendo) {
                    const tiempoActual = reproductorYT.getCurrentTime();
                    const tiempoTotal = reproductorYT.getDuration();
                    
                    if (tiempoTotal > 0) {
                        const porcentaje = (tiempoActual / tiempoTotal) * 100;
                        barraProgreso.value = porcentaje;
                        
                        txtTiempoActual.textContent = formatearTiempo(tiempoActual);
                        txtTiempoTotal.textContent = formatearTiempo(tiempoTotal);
                    }
                }
            }, 1000); // Se actualiza cada segundo
        }

        // Permitir adelantar la canción arrastrando la barra
        barraProgreso.addEventListener('input', () => {
            if (reproductorYT && reproductorYT.getDuration) {
                const nuevoTiempo = (barraProgreso.value / 100) * reproductorYT.getDuration();
                reproductorYT.seekTo(nuevoTiempo, true);
            }
        });
    </script>
</body>
</html>
